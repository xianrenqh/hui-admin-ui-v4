<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>注册</title>
	<link rel="stylesheet" href="./component/hui/css/hui.css" />
	<link rel="stylesheet" href="./admin/css/other/login.css" />
	<link rel="stylesheet" href="./admin/css/variables.css" />
	<script>if (window.self != window.top) { top.location.reload();}</script>
</head>

<body>
	<div class="login-page" style="background-image: url(./admin/images/background.svg)">
		<div class="layui-row">
			<div class="layui-col-sm6 login-bg layui-hide-xs">
				<img class="login-bg-img" src="./admin/images/banner.png" alt="" />
			</div>
			<div class="layui-col-sm6 layui-col-xs12 login-form">
				<div class="layui-form">
					<div class="form-center">
						<div class="form-center-box">
							<div class="top-log-title">
								<img class="top-log" src="./admin/images/logo.png" alt="" />
								<span>注册账号</span>
							</div>
							<div class="top-desc">
								创 建 账 户 ， 开 始 使 用 Hui Admin
							</div>
							<div style="margin-top: 30px;">
								<div class="layui-form-item">
									<div class="layui-input-wrap">
										<div class="layui-input-prefix">
											<i class="layui-icon layui-icon-username"></i>
										</div>
										<input name="account" id="reg-account" lay-verify="required" placeholder="账户" autocomplete="off"
											class="layui-input">
									</div>
								</div>
								<div class="layui-form-item">
									<div class="layui-input-wrap">
										<div class="layui-input-prefix">
											<i class="layui-icon layui-icon-password"></i>
										</div>
										<input type="password" name="password" id="reg-password" value=""
											lay-verify="required" placeholder="密码" autocomplete="off"
											class="layui-input" lay-affix="eye">
									</div>
								</div>
								<div class="layui-form-item">
									<div class="layui-input-wrap">
										<div class="layui-input-prefix">
											<i class="layui-icon layui-icon-password"></i>
										</div>
										<input type="password" name="confirmPassword" value=""
											lay-verify="required|confirmPass" placeholder="确认密码" autocomplete="off"
											class="layui-input" lay-affix="eye">
									</div>
								</div>
								<div class="layui-form-item tab-log-verification">
									<div class="verification-text">
										<div class="layui-input-wrap">
											<div class="layui-input-prefix">
												<i class="layui-icon layui-icon-auz"></i>
											</div>
											<input name="captcha" id="reg-captcha-input" lay-verify="required" placeholder="验证码" autocomplete="off"
												class="layui-input">
										</div>
									</div>
									<canvas id="reg-captcha" class="verification-canvas" width="110" height="42" title="看不清？点击刷新"></canvas>
								</div>
								<div class="login-btn" style="margin-top: 20px;">
									<button type="button" lay-submit lay-filter="register" class="layui-btn login">注 册</button>
								</div>
								<div class="other-login">
									<div class="other-login-methods">
										已有账号？
									</div>
									<a class="greenText" href="./login.html">返回登录</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- 资 源 引 入 -->
	<script src="./component/layui/layui.js"></script>
	<script src="./component/hui/hui.js"></script>
	<script src="./admin/js/captcha.js"></script>
	<script>
		layui.use(['form', 'button', 'popup', 'jquery'], function () {
			var form = layui.form;
			var button = layui.button;
			var popup = layui.popup;
			var $ = layui.jquery;

			// 动态验证码（点击刷新）
			var captchaCanvas = document.getElementById('reg-captcha');
			var captchaInput = document.getElementById('reg-captcha-input');
			function refreshCaptcha() {
				Captcha.render(captchaCanvas);
				captchaInput.value = '';
			}
			refreshCaptcha();
			$(captchaCanvas).on('click', refreshCaptcha);

			// 确认密码校验
			form.verify({
				confirmPass: function (value) {
					if (value !== $('#reg-password').val()) {
						return '两次输入的密码不一致';
					}
				}
			});

			// 注 册 提 交
			form.on('submit(register)', function (data) {
				// 校验验证码（本地演示逻辑，接入后端后改为服务端校验）
				if (!Captcha.check(captchaCanvas, captchaInput)) {
					popup.failure('验证码不正确');
					refreshCaptcha();
					return false;
				}

				/// 验证

				/// 注册（本地演示直接成功）

				/// 动画
				button.load({
					elem: '.login',
					time: 1500,
					done: function () {
						popup.success('注册成功，请登录', function () {
							location.href = './login.html';
						});
					}
				})

				return false;
			});
		})
	</script>
</body>

</html>
